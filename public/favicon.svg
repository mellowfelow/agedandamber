<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7A9" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#F5D77F" />
    </linearGradient>

    <!-- Dark Cask Amber Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2A1A0E" />
      <stop offset="60%" stop-color="#140C07" />
      <stop offset="100%" stop-color="#080402" />
    </radialGradient>

    <!-- Subtle Gold Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Leather/Cask Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Outer Fine Filigree Octagon/Crest Border -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="12 6" opacity="0.6" />
  
  <!-- Outer Double Circle Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />

  <!-- Corner Diamond Accents -->
  <polygon points="256,28 262,38 256,48 250,38" fill="url(#goldGrad)" />
  <polygon points="256,464 262,474 256,484 250,474" fill="url(#goldGrad)" />
  <polygon points="28,256 38,262 48,256 38,250" fill="url(#goldGrad)" />
  <polygon points="464,256 474,262 484,256 474,250" fill="url(#goldGrad)" />

  <!-- Stylized Oak Cask Barrel Contour & Glass Crest (Mature Crest) -->
  <!-- Oak Staves / Cask Ribs -->
  <path d="M170 140 C200 130, 312 130, 342 140 C370 210, 370 302, 342 372 C312 382, 200 382, 170 372 C142 302, 142 210, 170 140 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" />

  <!-- Central "A&A" Elegant Serif Monogram Crest -->
  <g filter="url(#goldGlow)">
    <!-- Primary Serif 'A' (Left - Aged) -->
    <path d="M185 330 L220 180 L235 180 L270 330 L250 330 L242 295 L212 295 L205 330 Z M217 275 L237 275 L227 225 Z" fill="url(#goldGrad)" />

    <!-- Ampersand & Oak Leaf Accent Center -->
    <path d="M256 220 C246 200, 266 185, 256 170 C246 185, 266 200, 256 220 Z" fill="url(#goldGrad)" />

    <!-- Secondary Interlocking Serif 'A' (Right - Amber) -->
    <path d="M242 330 L277 180 L292 180 L327 330 L307 330 L299 295 L269 295 L262 330 Z M274 275 L294 275 L284 225 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Copper / Amber Drop / Cask Seal Emblem -->
    <circle cx="256" cy="365" r="12" fill="url(#goldGrad)" />
    <path d="M256 348 C250 358, 244 365, 244 371 C244 378, 249 383, 256 383 C263 383, 268 378, 268 371 C268 365, 262 358, 256 348 Z" fill="#E67E22" opacity="0.9" />
  </g>

  <!-- Micro "EST. 2018" Arc or Stars -->
  <path d="M190 115 L200 110 L210 115" stroke="url(#goldGrad)" stroke-width="2" fill="none" />
  <circle cx="256" cy="110" r="3" fill="url(#goldGrad)" />
  <circle cx="240" cy="112" r="2" fill="url(#goldGrad)" />
  <circle cx="272" cy="112" r="2" fill="url(#goldGrad)" />
</svg>
